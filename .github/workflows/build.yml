name: Build mod

on:
  push:
    paths-ignore:
      - '.github/workflows/inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fightadvisor-jar
          path: build/libs/fightadvisor-1.0.0.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-build${{ github.run_number }}" \
            build/libs/fightadvisor-1.0.0.jar \
            --title "FightAdvisor 1.0.0 (build ${{ github.run_number }})" \
            --notes "Mod na Fabric 1.21.4. Wymaga Fabric API 0.118.0+1.21.4."
