name: Inspect mappings

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build (fills the Loom cache)
        run: gradle build
      - name: javap
        run: |
          JAR=""
          for j in $(find ~/.gradle -name '*.jar' -size +10M ! -name '*sources*'); do
            if javap -cp "$j" net.minecraft.scoreboard.Team >/dev/null 2>&1; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          OUT=$( {
            echo "== Team/AbstractTeam decorateName"
            javap -p -cp "$JAR" net.minecraft.scoreboard.Team net.minecraft.scoreboard.AbstractTeam | grep -E "decorateName"
            echo "== InGameHud overlay"
            javap -p -cp "$JAR" net.minecraft.client.gui.hud.InGameHud | grep -E "setOverlayMessage"
            echo "== PlayerListHud getPlayerName"
            javap -p -cp "$JAR" net.minecraft.client.gui.hud.PlayerListHud | grep -E "getPlayerName"
            echo "== TextFieldWidget"
            javap -p -cp "$JAR" net.minecraft.client.gui.widget.TextFieldWidget | grep -E "TextFieldWidget\(|setMaxLength|setText|setChangedListener|setPlaceholder"
            echo "== Session"
            javap -p -cp "$JAR" net.minecraft.client.session.Session | grep -E "getUsername"
            echo "== MinecraftClient session"
            javap -p -cp "$JAR" net.minecraft.client.MinecraftClient | grep -E "getSession"
            echo "== Style withColor"
            javap -p -cp "$JAR" net.minecraft.text.Style | grep -E "withColor"
          } 2>&1 )
          echo "$OUT"
          MSG="${OUT//$'\n'/%0A}"
          echo "::notice title=javap::$MSG"
